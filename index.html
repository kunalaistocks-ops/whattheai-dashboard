<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>What the AI!? · Weekly read</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="assets/chart.umd.min.js"></script>
<script src="assets/xlsx.full.min.js"></script>
<script src="data/seed.js"></script>
<style>
:root{--ink:#12233D;--page:#FBF7F0;--white:#FFFFFF;--now:#E4572E;--then:#AEB7C4;--slate:#536173;--up:#2E6B4F;--down:#C2306F;--line:#E8E1D5;--soft:#F4EEE4}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--page);color:var(--ink);font:15px/1.5 "IBM Plex Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--now);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* gate */
#gate{position:fixed;inset:0;background:var(--ink);display:grid;place-items:center;z-index:50;padding:20px}
#gate form{background:var(--white);border-radius:14px;padding:30px;width:min(360px,100%)}
#gate h1{font-size:26px}#gate p{color:var(--slate);font-size:14px;margin:4px 0 16px}
#gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
#gate .err{color:var(--down);font-size:13px;min-height:18px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--ink);color:#DCE3EC;padding:24px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:Fraunces,serif;font-size:21px;color:#fff;padding:0 10px}
.brand b{color:var(--now);font-weight:600}
.brand small{display:block;font:13px "IBM Plex Sans";color:#93A1B3;margin-top:2px}
nav{margin-top:26px;display:grid;gap:2px}
nav .grp{font-size:12px;color:#7F8DA0;padding:16px 10px 6px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#DCE3EC;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px}
nav button:hover{background:#1C3150}
nav button[aria-current=page]{background:#fff;color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#5B6B80;flex:none}
.dot.Scale{background:#58B38A}.dot.Hold{background:#C9B48A}.dot.Fix{background:#F0709F}
main{padding:28px clamp(18px,3vw,44px) 60px;min-width:0;max-width:1280px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.topbar .week{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:9px;padding:4px 6px 4px 12px;font-size:14px}
.topbar select{border:0;background:transparent;font-weight:600;padding:4px;cursor:pointer}
.src{margin-left:auto;font-size:13px;color:var(--slate);display:flex;align-items:center;gap:8px}
.src i{width:8px;height:8px;border-radius:50%;background:#C9B48A;display:inline-block}
.src i.live{background:var(--up)}
.page{display:none}.page.on{display:block}

/* summary hero */
.verdict{padding:6px 0 26px;border-bottom:1px solid var(--line);margin-bottom:26px}
.verdict .when{font-size:14px;color:var(--slate)}
.verdict h1{font-size:clamp(26px,3vw,38px);line-height:1.18;margin-top:8px;max-width:30ch;font-weight:400}
.verdict h1 strong{font-weight:600}
.read{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-bottom:34px}
.read h3{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.read h3::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}
.read ul{list-style:none;display:grid;gap:10px}
.read li{font-size:14.5px;line-height:1.45;padding-left:12px;border-left:2px solid var(--c)}
.read li small{display:block;color:var(--slate);font-size:12.5px;margin-top:2px}
.read .none{color:var(--slate);font-size:14px}

/* tiles */
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sechead h2{font-size:22px}
.legend{font-size:13px;color:var(--slate);display:flex;gap:14px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:8px;border-radius:2px;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;text-align:left;cursor:pointer;display:grid;gap:12px;transition:border-color .15s}
.tile:hover{border-color:#C9BFAE}
.tile header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile header b{font-family:Fraunces,serif;font-size:19px;font-weight:600}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.tag.Scale{background:#E3F1EA;color:var(--up)}.tag.Hold{background:#F4EEE0;color:#7A6230}.tag.Fix{background:#FBE4EE;color:var(--down)}.tag.Wait{background:var(--soft);color:var(--slate)}
.big{display:flex;align-items:baseline;gap:8px}
.big .n{font-family:Fraunces,serif;font-size:30px;line-height:1}
.big .l{font-size:13px;color:var(--slate)}
.delta{font-size:13px;font-weight:600}.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--slate)}
.cmp{display:grid;gap:5px}
.cmp .row{display:grid;grid-template-columns:86px 1fr 52px;align-items:center;gap:8px;font-size:12.5px;color:var(--slate)}
.cmp .bar{height:9px;background:var(--soft);border-radius:5px;overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:5px}
.cmp .v{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .say{font-size:13.5px;line-height:1.4;color:var(--ink)}
.tile .open{font-size:13px;color:var(--now);font-weight:600}
.tag small{font-weight:400}

/* deep dive */
.dhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.dhead h1{font-size:34px}
.dhead .tag{margin-top:10px}
.dsay{font-family:Fraunces,serif;font-size:20px;line-height:1.35;max-width:52ch;margin:6px 0 22px;font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:var(--white);margin-bottom:18px}
.kpi{padding:16px 18px;border-right:1px solid var(--line)}.kpi:last-child{border-right:0}
.kpi .l{font-size:13px;color:var(--slate)}
.kpi .n{font-family:Fraunces,serif;font-size:28px;margin:2px 0}
.kpi .was{font-size:12.5px;color:var(--slate)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h3{font-size:17px}.panel .sub{font-size:13px;color:var(--slate);margin:2px 0 12px}
.chart{position:relative;height:250px}
.latest{display:grid;gap:10px}
.latest .t{font-size:16px;font-weight:600;line-height:1.35}
.latest .meta{font-size:13px;color:var(--slate)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.vs div{background:var(--soft);border-radius:9px;padding:10px 12px}
.vs .l{font-size:12.5px;color:var(--slate)}.vs .n{font-family:Fraunces,serif;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--slate);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.idx{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.idx .b{width:70px;height:7px;background:var(--soft);border-radius:4px;position:relative}
.idx .b i{position:absolute;top:0;bottom:0;border-radius:4px}
.idx .b::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--then)}
td a,.latest .t a{color:var(--ink)}
.empty{color:var(--slate);font-size:14px;padding:12px 0}
.notes ul{list-style:none;display:grid;gap:10px}
.notes li{font-size:14px;padding-left:12px;border-left:2px solid var(--c)}

/* plan + health + settings */
.plan{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:120px 1fr 140px;gap:14px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.prow .d{font-weight:600;font-size:14px}.prow .d small{display:block;color:var(--slate);font-weight:400}
.prow .h{font-size:15px}.prow .h small{display:block;font-size:13px;color:var(--slate)}
.st{justify-self:end;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--soft);color:var(--slate)}
.st.posted{background:#E3F1EA;color:var(--up)}.st.held{background:#FBE4EE;color:var(--down)}.st.scripted,.st.qc{background:#E7ECF3;color:var(--ink)}
.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:13px;color:var(--slate)}
.field input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--slate)}
.gaps li{margin:0 0 8px 18px;font-size:14px}
@media(max-width:1080px){.tiles{grid-template-columns:repeat(2,1fr)}.read{grid-template-columns:1fr;gap:20px}.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media(max-width:720px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;padding:14px}nav{display:flex;flex-wrap:wrap;margin-top:12px}nav .grp{display:none}nav button{width:auto}.tiles{grid-template-columns:1fr}.prow{grid-template-columns:1fr}.st{justify-self:start}main{padding:18px 14px 40px}}
</style></head>
<body>
<div id="gate"><form id="gateForm">
  <h1>What the AI!?</h1><p>Weekly performance read. Enter the passcode to open it.</p>
  <input id="pass" type="password" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode">
  <div class="err" id="perr" role="alert"></div>
  <button class="btn wide" type="submit">Open the dashboard</button>
</form></div>

<div class="shell" id="app" hidden>
<aside>
  <div class="brand">What the <b>AI!?</b><small>Weekly read for Kunal</small></div>
  <nav id="nav"></nav>
</aside>
<main>
  <div class="topbar">
    <div class="week"><span>Week of</span><select id="weekSel" aria-label="Choose week"></select></div>
    <div class="src"><i id="srcDot"></i><span id="srcText"></span></div>
  </div>
  <section class="page on" id="p-summary"></section>
  <section class="page" id="p-medium"></section>
  <section class="page" id="p-plan"></section>
  <section class="page" id="p-health"></section>
  <section class="page" id="p-settings"></section>
</main>
</div>

<script>
/* ---------- settings ---------- */
const PASS_HASH="27ddb1c5eb2c187072abbbd13672621f866472f3599594900d73f62e5ed843dd";
const DEFAULT_SHEET="";
const TABS=["Content_Log","Daily_Followers","Targets","Incidents","Grok_QC","Insights","Plan_Status"];
const MEDIA=[
 {id:"linkedin",name:"LinkedIn",fol:"linkedin",plat:["linkedin"],unit:"impressions"},
 {id:"instagram",name:"Instagram",fol:"instagram",plat:["instagram"],unit:"reach"},
 {id:"youtube",name:"YouTube Shorts",fol:"youtube_subs",plat:["youtube"],unit:"views"},
 {id:"facebook",name:"Facebook",fol:"facebook",plat:["facebook"],unit:"reach"},
 {id:"x",name:"X",fol:"x",plat:["x"],unit:"impressions"},
 {id:"newsletter",name:"Newsletter",fol:"substack",plat:["substack","newsletter","linkedin_newsletter"],unit:"opens"}];
const COL={now:"#E4572E",then:"#AEB7C4",ink:"#12233D",up:"#2E6B4F",down:"#C2306F"};

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{if(v===undefined||v===null||v===""||v==="n/a")return null;const n=parseFloat(String(v).replace(/,/g,""));return isNaN(n)?null:n};
const dstr=v=>{if(v instanceof Date)return new Date(v.getTime()+12*3600e3).toISOString().slice(0,10);if(typeof v==="number")return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);return String(v||"").slice(0,10)};
const fmt=n=>n==null||isNaN(n)?"n/a":Math.round(n).toLocaleString("en-IN");
const fmt1=n=>n==null||isNaN(n)?"n/a":n.toFixed(1);
const todayIST=()=>new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10);
const add=(d,n)=>new Date(new Date(d+"T00:00:00Z").getTime()+n*864e5).toISOString().slice(0,10);
const monday=d=>{const w=(new Date(d+"T00:00:00Z").getUTCDay()+6)%7;return add(d,-w)};
const nice=d=>new Date(d+"T00:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"});
const niceDay=d=>new Date(d+"T00:00:00Z").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
const pct=(a,b)=>a==null||b==null||!b?null:(a-b)/b*100;
const deltaHTML=(p,suffix="")=>p==null?`<span class="delta flat">no comparison yet</span>`:`<span class="delta ${p>2?"up":p<-2?"down":"flat"}">${p>0?"+":""}${Math.round(p)}%${suffix}</span>`;
const avg=a=>{const b=a.filter(x=>x!=null);return b.length?b.reduce((s,x)=>s+x,0)/b.length:null};
const sum=a=>a.filter(x=>x!=null).reduce((s,x)=>s+x,0);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'&&t[i+1]=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}else{if(c=='"')q=true;else if(c==","){row.push(f);f=""}else if(c=="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!="\r")f+=c}}if(f!==""||row.length){row.push(f);rows.push(row)}const h=(rows.shift()||[]).map(x=>x.trim());return rows.filter(r=>r.some(x=>x!=="")).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])))}
const charts={};function chart(el,cfg){if(charts[el.id])charts[el.id].destroy();Chart.defaults.font.family="IBM Plex Sans";Chart.defaults.color="#536173";charts[el.id]=new Chart(el,cfg)}

/* ---------- data ---------- */
const SEED=window.WTAI_SEED||{};
let D=null,SRC="seed",timer=null,WEEK=null,CUR="summary";
function reachOf(r){return num(r.reach_7d)??num(r.reach_48h)??num(r.impressions)??num(r.views)}
function scoreOf(r){for(const s of["7d","48h"]){const re=num(r["reach_"+s]);if(re)return((num(r["shares_"+s])||0)*3+(num(r["saves_"+s])||0)*2+(num(r["follows_"+s])||0)*5+(num(r["comments_"+s])||0))/re*1000}return null}
function engOf(r){for(const s of["7d","48h"]){const re=num(r["reach_"+s]);if(re){const e=(num(r["shares_"+s])||0)+(num(r["saves_"+s])||0)+(num(r["comments_"+s])||0)+(num(r["likes_"+s])||0);return e/re*100}}return null}
function build(live,only){
  const d={};if(!only)for(const k of Object.keys(SEED))d[k]=SEED[k];if(only)d.LinkedInPlan=SEED.LinkedInPlan;for(const t of TABS)d[t]=d[t]||[];
  if(live){for(const t of TABS){if(!live[t]||!live[t].length)continue;
    if(only){d[t]=live[t];continue}
    if(t==="Daily_Followers"){const m={};[...(SEED.Daily_Followers||[]),...live[t]].forEach(r=>{const k=dstr(r.date);m[k]={...(m[k]||{}),...Object.fromEntries(Object.entries(r).filter(([a,b])=>b!==""&&b!=null)),date:k}});d[t]=Object.values(m)}
    else if(t==="Content_Log"){const urls=new Set(live[t].map(r=>r.url).filter(Boolean));d[t]=[...(SEED.Content_Log||[]).filter(r=>!urls.has(r.url)),...live[t]]}
    else if(t==="Insights"){d[t]=[...(SEED.Insights||[]),...live[t]]}
    else d[t]=live[t]}}
  d.Daily_Followers=(d.Daily_Followers||[]).map(r=>({...r,date:dstr(r.date)})).filter(r=>r.date&&r.date<=todayIST()).sort((a,b)=>a.date<b.date?-1:1);
  d.Content_Log=(d.Content_Log||[]).filter(r=>(r.content_id||r.url)&&!String(r.title||"").startsWith("EXAMPLE")).map(r=>({...r,date:dstr(r.date),platform:String(r.platform||"").toLowerCase(),reach:reachOf(r),score:scoreOf(r),eng:engOf(r)})).filter(r=>r.date<=todayIST());
  d.Insights=(d.Insights||[]).map(r=>({...r,date:dstr(r.date)}));
  return d}
async function loadSheet(idOrUrl,quiet){
  const m=String(idOrUrl||"").match(/\/d\/([a-zA-Z0-9-_]+)/);const id=m?m[1]:String(idOrUrl||"").trim();if(!id)return;
  try{const live={};for(const t of TABS){try{const r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(t)}`);live[t]=r.ok?parseCSV(await r.text()):[]}catch(e){live[t]=[]}}
    if(!live.Content_Log.length&&!live.Daily_Followers.length)throw new Error("the sheet has no rows yet");
    store.set("wtai_sheet",id);SRC="live";D=build(live);setWeeks();render();
    clearInterval(timer);timer=setInterval(()=>loadSheet(id,true),600000);
  }catch(e){if(!quiet)msg("Couldn't read the sheet: "+e.message+". Share it as 'Anyone with the link can view', or load the .xlsx file.")}}
function loadFile(file){const rd=new FileReader();rd.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});const live={};for(const t of TABS){const ws=wb.Sheets[t];live[t]=ws?XLSX.utils.sheet_to_json(ws,{defval:""}):[]}SRC="file:"+file.name;D=build(live);setWeeks();render()}catch(err){msg("Couldn't read that file: "+err.message)}};rd.readAsArrayBuffer(file)}
function msg(t){const el=$("setMsg");if(el)el.textContent=t}

/* ---------- metrics ---------- */
function posts(m,from,to){return D.Content_Log.filter(r=>m.plat.includes(r.platform)&&r.date>=from&&r.date<=to)}
function folAt(k,date){let v=null,dd=null;for(const r of D.Daily_Followers){if(r.date>date)break;const n=num(r[k]);if(n!=null){v=n;dd=r.date}}return v==null?null:{v,date:dd}}
function stats(m){
  const ws=WEEK,we=add(WEEK,6),ls=add(WEEK,-7),le=add(WEEK,-1);
  const tw=posts(m,ws,we),lw=posts(m,ls,le);
  const all=D.Content_Log.filter(r=>m.plat.includes(r.platform)&&r.date<=we).sort((a,b)=>(a.date+(a.slot_ist||""))<(b.date+(b.slot_ist||""))?-1:1);
  const latest=all[all.length-1]||null;
  const fNow=folAt(m.fol,we),fThen=folAt(m.fol,le);
  const s={m,tw,lw,latest,
    fNow:fNow?fNow.v:null,fDate:fNow?fNow.date:null,fChange:fNow&&fThen&&fThen.date!==fNow.date?fNow.v-fThen.v:null,
    reachTW:avg(tw.map(r=>r.reach)),reachLW:avg(lw.map(r=>r.reach)),
    scoreTW:avg(tw.map(r=>r.score)),scoreLW:avg(lw.map(r=>r.score)),
    engTW:avg(tw.map(r=>r.eng)),engLW:avg(lw.map(r=>r.eng)),
    totTW:sum(tw.map(r=>r.reach)),totLW:sum(lw.map(r=>r.reach))};
  // compare latest post against last week's average; if no posts this week, compare last week against the week before
  s.base=s.reachLW;if(s.base==null){const pw=posts(m,add(WEEK,-14),add(WEEK,-8));s.base=avg(pw.map(r=>r.reach));s.baseLabel="week before"}else s.baseLabel="last week's average";
  s.latestVs=latest&&latest.reach!=null?pct(latest.reach,s.base):null;
  const change=pct(s.reachTW,s.reachLW)??(tw.length?null:null);
  s.reachChange=change;
  let a=s.reachTW,b=s.reachLW,sa=s.scoreTW,sb=s.scoreLW;s.judged="this week";
  if(!tw.length&&lw.length){const pw=posts(m,add(WEEK,-14),add(WEEK,-8));a=s.reachLW;b=avg(pw.map(r=>r.reach));sa=s.scoreLW;sb=avg(pw.map(r=>r.score));s.judged="last week"}
  s.vReach=pct(a,b);s.vScore=pct(sa,sb);
  if(!tw.length&&!lw.length)s.verdict="Wait";
  else if(s.vReach==null&&s.vScore==null)s.verdict="Hold";
  else if((s.vReach??0)<=-20)s.verdict="Fix";
  else if((s.vReach??0)>=20||(s.vScore??0)>=25)s.verdict="Scale";
  else s.verdict="Hold";
  s.say=sayFor(s);return s}
function sayFor(s){
  const n=s.m.name,u=s.m.unit;
  if(!s.latest)return `No ${n} posts logged yet. Grok adds them 48 hours after each post.`;
  if(!s.tw.length){const gap=Math.round((new Date(add(WEEK,6))-new Date(s.latest.date))/864e5);
    return `Nothing posted this week yet. The last post went out on ${niceDay(s.latest.date)}${s.reachLW!=null?` and last week averaged ${fmt(s.reachLW)} ${u} a post`:""}.`}
  if(s.reachChange==null)return `${s.tw.length} post${s.tw.length>1?"s":""} this week, averaging ${fmt(s.reachTW)} ${u}. First week to compare against.`;
  const dir=s.reachChange>=0?"up":"down";
  return `${s.tw.length} post${s.tw.length>1?"s":""} this week, averaging ${fmt(s.reachTW)} ${u}, ${dir} ${Math.abs(Math.round(s.reachChange))}% on last week.`}

/* ---------- sample data (clearly labelled) ---------- */
function sample(){
  let seed=11;const r=()=>(seed=(seed*9301+49297)%233280)/233280;const out={Content_Log:[],Daily_Followers:[],Insights:[],Grok_QC:[],Incidents:[]};
  const base={linkedin:[1200,2],instagram:[180,14],youtube:[220,14],facebook:[90,14],x:[140,9],substack:[260,1]};
  const t=todayIST(),start=add(monday(t),-14);const fol={linkedin:6100,instagram:48,youtube_subs:30,facebook:120,x:66,substack:310};
  for(let d=start;d<=t;d=add(d,1)){const row={date:d};for(const k in fol){fol[k]+=Math.round(r()*(k==="linkedin"?25:6));row[k]=fol[k]}out.Daily_Followers.push(row);
    for(const p in base){const [b,perWeek]=base[p];if(r()>perWeek/7)continue;const growth=1+(new Date(d)-new Date(start))/864e5*.03;const reach=Math.round(b*growth*(.5+r()*1.2));
      out.Content_Log.push({date:d,platform:p,content_id:p+d,title:`Sample ${p} post, ${nice(d)}`,reach_48h:reach,shares_48h:Math.round(reach*r()*.02),saves_48h:Math.round(reach*r()*.03),follows_48h:Math.round(reach*r()*.008),comments_48h:Math.round(r()*8),likes_48h:Math.round(reach*.03)});out.Grok_QC.push({date:d,gate_g:r()>.05?"PASS":"FAIL"})}}
  out.Insights=[{date:t,medium:"all",type:"headline",text:"Sample week: this text and every number on screen are made up, to show how the read will look."},{date:t,medium:"linkedin",type:"working",text:"Sample: carousels with the prompt on slide 3 earned the most saves."},{date:t,medium:"instagram",type:"not working",text:"Sample: news reels without a hook lost viewers in the first 2 seconds."},{date:t,medium:"all",type:"changing",text:"Sample: moving the weekly video to Monday 09:00."}];
  return out}

async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

let ok=false;try{ok=sessionStorage.getItem("wtai_ok")==="1"}catch(e){}if(ok)start();else $("pass").focus();
